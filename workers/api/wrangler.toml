name = "khienviet-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# database_id là giá trị giả cho đến khi có tài khoản Cloudflare của dự án.
# Chạy local (wrangler dev, test) không cần ID thật.
[[d1_databases]]
binding = "DB"
database_name = "khienviet"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Rate Limiting binding chỉ hỗ trợ period 10 hoặc 60 giây, đếm theo từng vị trí
# Cloudflare và gần đúng. Giới hạn theo giờ cho mỗi reporter được kiểm tra bằng D1.
[[ratelimits]]
name = "INSTALL_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# Tính lại điểm (giảm trọng số theo thời gian) mỗi 6 giờ.
[triggers]
crons = ["17 */6 * * *"]

# Ngưỡng tính điểm: công khai, xem docs/ARCHITECTURE.md mục 4.
[vars]
SCORE_HALF_LIFE_DAYS = "30"
SCORE_MIN_REPORTERS = "3"
SCORE_MEDIUM = "1.5"
SCORE_HIGH = "4"
RATIO_MEDIUM = "0.3"
RATIO_HIGH = "0.7"
HIGH_MIN_SCAM_REPORTERS = "5"
REPORTS_PER_HOUR_PER_REPORTER = "10"
